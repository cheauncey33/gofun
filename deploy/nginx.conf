server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # WebSocket 订单实时推送：需转发 Upgrade/Connection 头完成协议升级。
    location /api/v1/ws {
        proxy_pass http://backend:8080/api/v1/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 长连接：拉长读超时，避免空闲被 nginx 断开
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prometheus 指标端点：不对公网开放。
    # 监控栈与 backend 同处容器网络，应直接抓取 backend:8080/metrics；
    # 这里保留代理仅为内网排障，并限制来源为私有网段。
    location /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://backend:8080/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查探针保持对外可用，编排的 healthcheck 依赖它。
    location /healthz {
        access_log off;
        proxy_pass http://backend:8080/healthz;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
