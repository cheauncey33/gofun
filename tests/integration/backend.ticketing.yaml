server:
  host: "127.0.0.1"
  port: 18080
  mode: "test"

mysql:
  dsn: "fuchang:fuchang-it-mysql@tcp(127.0.0.1:13306)/fuchang_ticketing_it?charset=utf8mb4&parseTime=True&loc=Local"
  max_idle_conns: 20
  max_open_conns: 80
  conn_max_lifetime: 300

redis:
  addr: "127.0.0.1:16379"
  password: "fuchang-it-redis"
  db: 0
  pool_size: 20

rabbitmq:
  url: "amqp://fuchang:fuchang-it-rabbit@127.0.0.1:25672/"
  queue_name: "fuchang.it.order.queue"
  retry_queue_name: "fuchang.it.order.retry"
  dlx_name: "fuchang.it.order.dlx"
  dlq_name: "fuchang.it.order.dead"

jwt:
  secret: "fuchang-integration-test-secret-only"
  expire_secs: 3600
  refresh_expire_secs: 86400

ticket_qr:
  secret: "fuchang-integration-ticket-qr-secret-only"

snowflake:
  node_id: 9

log:
  level: "debug"
  file_path: ""
  max_size: 10
  max_backups: 1
  max_age: 1

pprof:
  enabled: true
  host: "127.0.0.1"
  port: 16060

telemetry:
  enabled: true
  service_name: "fuchang-ticketing-it"
  otlp_endpoint: "127.0.0.1:4317"
  insecure: true
  sample_ratio: 0.01

ratelimit:
  global_rate: 1000
  global_burst: 1200
  ip_rate: 100
  ip_burst: 120
  distributed_write_enabled: true
  write_window_ms: 1000
  write_max_per_window: 100000
  write_fail_open: false
  write_rate: 100000
  write_burst: 100000

order_consumer:
  worker_count: 2
  prefetch_count: 2
  max_retries: 2

order_outbox:
  write_mode: batch
  publish_workers: 4
  publish_batch: 200
  tick_interval_ms: 200
  buffer_batch_size: 50
  flush_interval_ms: 8
  max_buffer: 4000
  recover_interval_sec: 2

rush_sale:
  campaign_cache_ttl_ms: 3000

inventory:
  buckets_enabled: false
  bucket_count: 8
  min_quota_to_bucket: 64
  bucket_retry: 4

delayed_order:
  timeout_minutes: 1
  lock_timeout_sec: 5

elasticsearch:
  enabled: true
  addresses:
    - "http://127.0.0.1:19201"
  index: "fuchang_events"
  search_engine: "auto"
  sync_interval_minutes: 1
  sync_lock_timeout_sec: 60

cors:
  allow_origins:
    - "http://127.0.0.1:5173"
