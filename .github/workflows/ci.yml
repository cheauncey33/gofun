name: CI

on:
  push:
    branches: [master, main, feature/**]
  pull_request:

jobs:
  backend:
    name: Backend (go vet / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: go test
        working-directory: backend
        run: go test ./... -count=1

      - name: go build
        working-directory: backend
        run: go build ./...

  frontend:
    name: Frontend (npm build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install
        working-directory: frontend
        run: npm ci

      - name: build
        working-directory: frontend
        run: npm run build

  integration:
    name: Ticketing payment and verification E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Start disposable integration stack
        run: docker compose -p gofun-it -f tests/integration/docker-compose.ticketing.yml up -d --build

      - name: Wait for backend
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Payment, ticket issuance and verification E2E
        run: node tests/integration/payment_verification_e2e.mjs

      - name: Collect integration logs
        if: always()
        run: docker compose -p gofun-it -f tests/integration/docker-compose.ticketing.yml logs --no-color > integration-compose.log

      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-compose-logs
          path: integration-compose.log

      - name: Tear down disposable stack
        if: always()
        run: docker compose -p gofun-it -f tests/integration/docker-compose.ticketing.yml down -v --remove-orphans
