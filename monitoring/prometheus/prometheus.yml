global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "whu_snack_backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          service: "whu_snack_go"
          env: "dev"

  - job_name: "fuchang_ticketing_integration"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:18080"]
        labels:
          service: "fuchang_ticketing"
          env: "integration"
