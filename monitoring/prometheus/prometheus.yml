global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "gofun_backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          service: "gofun"
          env: "dev"

  - job_name: "gofun_ticketing_integration"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:18080"]
        labels:
          service: "gofun_ticketing"
          env: "integration"
