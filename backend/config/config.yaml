server:
  host: "127.0.0.1"
  port: 8080
  mode: "release"

mysql:
  dsn: "gofun:gofun123456@tcp(127.0.0.1:3307)/gofun?charset=utf8mb4&parseTime=True&loc=Local"
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 300

redis:
  addr: "127.0.0.1:6379"
  password: "redis123456"
  db: 0
  pool_size: 100

rabbitmq:
  url: "amqp://snack:rabbit123456@localhost:5672/"
  queue_name: "fuchang.order.queue"
  retry_queue_name: "fuchang.order.retry"
  dlx_name: "fuchang.order.dlx"
  dlq_name: "fuchang.order.dead"

jwt:
  secret: "dev-jwt-secret-please-change"
  expire_secs: 500
  refresh_expire_secs: 604800

ticket_qr:
  secret: "dev-ticket-qr-secret-please-change"
  previous_secrets: []

snowflake:
  node_id: 1

log:
  level: "info"
  file_path: ""
  max_size: 100
  max_backups: 7
  max_age: 30

ratelimit:
  global_rate: 100000
  global_burst: 100000
  ip_rate: 100000
  ip_burst: 100000

order_consumer:
  worker_count: 4
  prefetch_count: 5
  max_retries: 3

cors:
  allow_origins:
    - "http://127.0.0.1:5173"
    - "http://localhost:5173"
