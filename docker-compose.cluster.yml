x-backend-environment: &backend-environment
  SERVER_HOST: 0.0.0.0
  SERVER_PORT: 8080
  SERVER_MODE: release
  MYSQL_DSN: "gofun:${MYSQL_PASSWORD}@tcp(mysql-primary:3306)/gofun?charset=utf8mb4&parseTime=True&loc=Local"
  MYSQL_MAX_IDLE_CONNS: 10
  MYSQL_MAX_OPEN_CONNS: 50
  REDIS_ADDR: ""
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_MASTER_NAME: ticketing-master
  REDIS_SENTINEL_ADDRS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
  REDIS_POOL_SIZE: 50
  RABBITMQ_URL: amqp://snack:${RABBITMQ_PASSWORD}@rabbitmq-lb:5672/
  RABBITMQ_QUEUE_TYPE: quorum
  JWT_SECRET: ${JWT_SECRET}
  TICKET_QR_SECRET: ${TICKET_QR_SECRET}
  CORS_ALLOW_ORIGINS: ${APP_ORIGIN}
  RATELIMIT_GLOBAL_RATE: 100000
  RATELIMIT_GLOBAL_BURST: 100000
  RATELIMIT_IP_RATE: 100000
  RATELIMIT_IP_BURST: 100000
  RATELIMIT_WRITE_RATE: 100000
  RATELIMIT_WRITE_BURST: 100000
  RATELIMIT_DISTRIBUTED_WRITE_ENABLED: "false"
  ORDER_CONSUMER_WORKER_COUNT: 2
  ORDER_CONSUMER_PREFETCH_COUNT: 5
  ORDER_OUTBOX_PUBLISH_WORKERS: 2

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  restart: unless-stopped
  environment: *backend-environment
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
    interval: 5s
    timeout: 3s
    retries: 20
  depends_on:
    mysql-replication-init:
      condition: service_completed_successfully
    redis-sentinel-1:
      condition: service_started
    redis-sentinel-2:
      condition: service_started
    redis-sentinel-3:
      condition: service_started
    rabbitmq-lb:
      condition: service_started

x-rabbitmq: &rabbitmq
  image: rabbitmq:3.13-management-alpine
  restart: unless-stopped
  environment:
    RABBITMQ_DEFAULT_USER: snack
    RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
  volumes:
    - ./deploy/cluster/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    - ./deploy/cluster/rabbitmq-entrypoint.sh:/cluster/rabbitmq-entrypoint.sh:ro
  entrypoint: ["sh", "/cluster/rabbitmq-entrypoint.sh"]
  healthcheck:
    test: ["CMD-SHELL", "test -f /tmp/cluster-ready && su-exec rabbitmq rabbitmq-diagnostics -q check_running"]
    interval: 5s
    timeout: 5s
    retries: 30

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.cluster
    restart: unless-stopped
    ports:
      - "8088:80"
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
      backend-3:
        condition: service_healthy

  backend-1:
    <<: *backend
    environment:
      <<: *backend-environment
      SNOWFLAKE_NODE_ID: 11

  backend-2:
    <<: *backend
    environment:
      <<: *backend-environment
      SNOWFLAKE_NODE_ID: 12
    depends_on:
      backend-1:
        condition: service_healthy

  backend-3:
    <<: *backend
    environment:
      <<: *backend-environment
      SNOWFLAKE_NODE_ID: 13
    depends_on:
      backend-1:
        condition: service_healthy

  mysql-primary:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "3310:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: gofun
      MYSQL_USER: gofun
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    volumes:
      - mysql_primary_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  mysql-replica:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "3311:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
      TZ: Asia/Shanghai
    command:
      - --server-id=2
      - --relay-log=mysql-relay-bin
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    volumes:
      - mysql_replica_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  mysql-replication-init:
    image: mysql:8.0
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_REPLICATION_PASSWORD: ${MYSQL_REPLICATION_PASSWORD}
    volumes:
      - ./deploy/cluster/mysql-replication-init.sh:/cluster/mysql-replication-init.sh:ro
    entrypoint: ["sh", "/cluster/mysql-replication-init.sh"]
    depends_on:
      mysql-primary:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy

  redis-primary:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
      - --masterauth
      - ${REDIS_PASSWORD}
    volumes:
      - redis_primary_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-replica:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --replicaof
      - redis-primary
      - "6379"
      - --requirepass
      - ${REDIS_PASSWORD}
      - --masterauth
      - ${REDIS_PASSWORD}
    volumes:
      - redis_replica_data:/data
    depends_on:
      redis-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-sentinel-1:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_MASTER_NAME: ticketing-master
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./deploy/cluster/redis-sentinel-entrypoint.sh:/cluster/redis-sentinel-entrypoint.sh:ro
    entrypoint: ["sh", "/cluster/redis-sentinel-entrypoint.sh"]
    depends_on:
      redis-primary:
        condition: service_healthy
      redis-replica:
        condition: service_healthy

  redis-sentinel-2:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_MASTER_NAME: ticketing-master
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./deploy/cluster/redis-sentinel-entrypoint.sh:/cluster/redis-sentinel-entrypoint.sh:ro
    entrypoint: ["sh", "/cluster/redis-sentinel-entrypoint.sh"]
    depends_on:
      redis-primary:
        condition: service_healthy
      redis-replica:
        condition: service_healthy

  redis-sentinel-3:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_MASTER_NAME: ticketing-master
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./deploy/cluster/redis-sentinel-entrypoint.sh:/cluster/redis-sentinel-entrypoint.sh:ro
    entrypoint: ["sh", "/cluster/redis-sentinel-entrypoint.sh"]
    depends_on:
      redis-primary:
        condition: service_healthy
      redis-replica:
        condition: service_healthy

  rabbitmq-1:
    <<: *rabbitmq
    hostname: rabbitmq-1
    environment:
      RABBITMQ_DEFAULT_USER: snack
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
      RABBITMQ_NODENAME: rabbit@rabbitmq-1
    volumes:
      - rabbitmq_1_data:/var/lib/rabbitmq
      - ./deploy/cluster/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./deploy/cluster/rabbitmq-entrypoint.sh:/cluster/rabbitmq-entrypoint.sh:ro

  rabbitmq-2:
    <<: *rabbitmq
    hostname: rabbitmq-2
    environment:
      RABBITMQ_DEFAULT_USER: snack
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
      RABBITMQ_NODENAME: rabbit@rabbitmq-2
      RABBITMQ_CLUSTER_SEED: rabbitmq-1
    volumes:
      - rabbitmq_2_data:/var/lib/rabbitmq
      - ./deploy/cluster/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./deploy/cluster/rabbitmq-entrypoint.sh:/cluster/rabbitmq-entrypoint.sh:ro
    depends_on:
      rabbitmq-1:
        condition: service_healthy

  rabbitmq-3:
    <<: *rabbitmq
    hostname: rabbitmq-3
    environment:
      RABBITMQ_DEFAULT_USER: snack
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
      RABBITMQ_NODENAME: rabbit@rabbitmq-3
      RABBITMQ_CLUSTER_SEED: rabbitmq-1
    volumes:
      - rabbitmq_3_data:/var/lib/rabbitmq
      - ./deploy/cluster/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./deploy/cluster/rabbitmq-entrypoint.sh:/cluster/rabbitmq-entrypoint.sh:ro
    depends_on:
      rabbitmq-1:
        condition: service_healthy
      rabbitmq-2:
        condition: service_healthy

  rabbitmq-lb:
    image: haproxy:3.0-alpine
    restart: unless-stopped
    ports:
      - "5678:5672"
    volumes:
      - ./deploy/cluster/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      rabbitmq-1:
        condition: service_healthy
      rabbitmq-2:
        condition: service_healthy
      rabbitmq-3:
        condition: service_healthy

volumes:
  mysql_primary_data:
  mysql_replica_data:
  redis_primary_data:
  redis_replica_data:
  rabbitmq_1_data:
  rabbitmq_2_data:
  rabbitmq_3_data:
